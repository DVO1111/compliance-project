name: Database migrate

# MANUAL ONLY, AND DELIBERATELY NOT ON PUSH.
#
# Connecting this repository to the live Supabase project is the right
# destination. Pushing migrations to it automatically on merge is not,
# and will not be until the project's migration history has been
# reconciled with what the database actually contains.
#
# The reason is specific rather than cautious. `supabase db push` works
# out what to apply by comparing the files in supabase/migrations
# against supabase_migrations.schema_migrations in the target project.
# That table exists in the live project. The live schema, measured by
# scripts/fix/02-pharma-preflight.sql on 2026-10-21, is roughly the
# June schema plus hand-patches from scripts/fix/ — it is missing the
# lifecycle engine (20260905000000), electronic signatures
# (20260917000000), and everything built on them. So the table and the
# schema disagree, and until we know HOW they disagree, a push either
# applies nothing (hiding the gap permanently) or aborts partway
# through fifty migrations (leaving the database half-migrated).
#
# scripts/ci/expected-migration-failures.txt pins fourteen migrations
# that do not apply to a from-scratch Postgres at all, several because
# four files carry no timestamp and sort after every dated one. Those
# are a problem for any replay, in any order, by any tool.
#
# WHEN THE RECONCILIATION IS DONE, the change needed here is to add a
# `push:` trigger. Leave the dry run as the default input either way.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run lists what WOULD be applied; apply actually applies it'
        required: true
        default: dry-run
        type: choice
        options: [dry-run, apply]
      confirm:
        description: 'For apply only: type the project ref to confirm. Ignored on a dry run.'
        required: false
        type: string

concurrency:
  # Two pushes to one database at once is how a migration history gets
  # corrupted. One at a time, and never cancel one in flight.
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    name: ${{ inputs.mode }}
    runs-on: ubuntu-latest
    # A GitHub environment can carry a required reviewer, which is the
    # approval gate for an apply. Configure that in repository settings;
    # this job names it so the gate has somewhere to attach.
    environment: production-database

    # Lifted to the job so step-level `if:` can test it. The secrets
    # context is not available in `if`, but the env context is, which is
    # the only way to skip a step when a secret has not been set.
    env:
      DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install the Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      - name: Refuse an apply that was not confirmed
        if: inputs.mode == 'apply'
        env:
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ "${{ inputs.confirm }}" != "$REF" ]; then
            echo "::error::The confirm input must be the project ref. Nothing was applied."
            exit 1
          fi

      - name: Link the project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      # What the database believes it has. Read this before anything
      # else: it is the table that decides what a push will attempt, and
      # the dry run below is only meaningful beside it.
      #
      # `supabase migration list` prints one row per LOCAL file — about
      # 190 lines — with the answer in a middle column that is mostly
      # blank. So this filters its own output rather than asking the
      # database separately: the CLI is already authenticated by the
      # link above, which means this step needs no connection string and
      # works with only the access token and database password set.
      - name: Migration history, as the database records it
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase migration list --linked > /tmp/ml.txt 2>&1 || true
          # Columns are `Local` | `Remote` | `Time`, backtick-quoted.
          awk -F'|' '$2 ~ /[0-9]/ {gsub(/[` ]/,"",$2); print $2}' /tmp/ml.txt \
            | sort -u > /tmp/remote.txt
          awk -F'|' '$1 ~ /[0-9]/ && $2 !~ /[0-9]/ {gsub(/[` ]/,"",$1); print $1}' /tmp/ml.txt \
            | sort -u > /tmp/localonly.txt
          echo "RECORDED REMOTE: $(wc -l < /tmp/remote.txt) versions"
          echo "LOCAL ONLY (no remote record): $(wc -l < /tmp/localonly.txt) files"
          echo
          echo "--- every version the remote records, oldest first:"
          tr '\n' ' ' < /tmp/remote.txt; echo
          echo
          echo "--- local files with no remote record, oldest first:"
          tr '\n' ' ' < /tmp/localonly.txt; echo

      - name: Install psql client
        if: env.DB_HOST != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      # Both preflights are read-only, so a dry run is the right place
      # for them: they report the live state without changing it, and
      # the push plan below is only interpretable beside them.
      #
      # SKIPPED RATHER THAN FAILED when SUPABASE_DB_HOST is unset. These
      # need a connection string, which the CLI steps above do not — and
      # an empty host produces `postgresql://postgres.***@:5432/...`,
      # which psql reads as a local socket and reports as "is the server
      # running locally?", a message that sends you looking in entirely
      # the wrong place. The step below says what is actually missing.
      - name: Preflight — objects, and data against the new constraints
        if: env.DB_HOST != ''
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          CONN: postgresql://postgres.${{ secrets.SUPABASE_PROJECT_REF }}@${{ env.DB_HOST }}:5432/postgres
        run: |
          psql "$CONN" -f scripts/fix/02-pharma-preflight.sql
          psql "$CONN" -f scripts/fix/03-constraint-preflight.sql
          echo
          echo '=== MIGRATION EVIDENCE — which migrations can safely be repaired'
          psql "$CONN" -f scripts/fix/04-migration-evidence.sql > /tmp/ev.txt
          echo '--- verdict counts:'
          awk -F'|' 'NF>=4{print $4}' /tmp/ev.txt | sort | uniq -c
          echo
          echo '--- anything NOT cleanly applied (these stay out of the repair list):'
          grep -E 'PARTIAL|absent|nothing probeable' /tmp/ev.txt || echo '  none'
          echo
          echo '--- the repair command for every migration that reads applied:'
          awk -F'|' 'NF>=4 && $4=="applied" {printf "supabase migration repair --status applied %s\n", $1}' /tmp/ev.txt

      - name: Preflight skipped — SUPABASE_DB_HOST is not set
        if: env.DB_HOST == ''
        run: |
          echo "::warning::SUPABASE_DB_HOST is not set, so the two preflights were skipped."
          echo "Set it to the pooler host copied verbatim from the dashboard:"
          echo "  Project -> Settings -> Database -> connection string"
          echo "  e.g. aws-0-eu-west-1.pooler.supabase.com"
          echo "The migration history above does not need it; the preflights do."

      # `continue-on-error` because a refusal here is INFORMATION, not a
      # fault. The CLI exits non-zero when it finds local files dated
      # before the remote high-water mark — which is precisely the
      # condition this project is in, and precisely what the run is for.
      # Failing the job on it would hide the steps above.
      - name: Dry run — what a push WOULD apply
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked --dry-run

      - name: Apply
        if: inputs.mode == 'apply'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked

      # Proves the apply took, rather than trusting that it did. A
      # migration that reported success and left an object uncreated is
      # exactly the failure this repository has already been bitten by:
      # 20260921000000_licence_lifecycle was absent for weeks and
      # surfaced as "starter licences cannot be saved".
      # SUPABASE_DB_HOST is the pooler host copied verbatim from the
      # dashboard's connection string, e.g.
      # aws-0-eu-west-1.pooler.supabase.com. It is a secret rather than
      # assembled from a region because the host prefix is not always
      # "aws-0" — it varies by when and where the project was created,
      # and guessing it produces a confusing DNS failure at the end of
      # an otherwise successful apply.
      - name: Verify — re-run the preflight against the project
        if: inputs.mode == 'apply'
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql "postgresql://postgres.${{ secrets.SUPABASE_PROJECT_REF }}@${{ secrets.SUPABASE_DB_HOST }}:5432/postgres" \
            -f scripts/fix/02-pharma-preflight.sql
          psql "postgresql://postgres.${{ secrets.SUPABASE_PROJECT_REF }}@${{ secrets.SUPABASE_DB_HOST }}:5432/postgres" \
            -f scripts/fix/03-constraint-preflight.sql
