name: Database migrate

# MANUAL ONLY, AND DELIBERATELY NOT ON PUSH.
#
# Connecting this repository to the live Supabase project is the right
# destination. Pushing migrations to it automatically on merge is not,
# and will not be until the project's migration history has been
# reconciled with what the database actually contains.
#
# The reason is specific rather than cautious. `supabase db push` works
# out what to apply by comparing the files in supabase/migrations
# against supabase_migrations.schema_migrations in the target project.
# That table exists in the live project. The live schema, measured by
# scripts/fix/02-pharma-preflight.sql on 2026-10-21, is roughly the
# June schema plus hand-patches from scripts/fix/ — it is missing the
# lifecycle engine (20260905000000), electronic signatures
# (20260917000000), and everything built on them. So the table and the
# schema disagree, and until we know HOW they disagree, a push either
# applies nothing (hiding the gap permanently) or aborts partway
# through fifty migrations (leaving the database half-migrated).
#
# scripts/ci/expected-migration-failures.txt pins fourteen migrations
# that do not apply to a from-scratch Postgres at all, several because
# four files carry no timestamp and sort after every dated one. Those
# are a problem for any replay, in any order, by any tool.
#
# WHEN THE RECONCILIATION IS DONE, the change needed here is to add a
# `push:` trigger. Leave the dry run as the default input either way.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run reports only; repair writes history without executing SQL; apply runs the migrations'
        required: true
        default: dry-run
        type: choice
        options: [dry-run, repair, apply]
      confirm:
        description: 'For repair and apply: type the project ref to confirm. Ignored on a dry run.'
        required: false
        type: string
      backup_confirmed:
        description: 'For apply only: a backup of the live database has been taken'
        required: false
        default: false
        type: boolean

concurrency:
  # Two pushes to one database at once is how a migration history gets
  # corrupted. One at a time, and never cancel one in flight.
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    name: ${{ inputs.mode }}
    runs-on: ubuntu-latest
    # A GitHub environment can carry a required reviewer, which is the
    # approval gate for an apply. Configure that in repository settings;
    # this job names it so the gate has somewhere to attach.
    environment: production-database

    # Lifted to the job so step-level `if:` can test it. The secrets
    # context is not available in `if`, but the env context is, which is
    # the only way to skip a step when a secret has not been set.
    env:
      DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install the Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      - name: Refuse a write that was not confirmed
        if: inputs.mode != 'dry-run'
        env:
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ "${{ inputs.confirm }}" != "$REF" ]; then
            echo "::error::The confirm input must be the project ref. Nothing was written."
            exit 1
          fi
          #  A BACKUP IS A PRECONDITION, NOT A REMINDER. The apply runs
          #  fifty migrations against a database holding real customer
          #  workspaces, three of them row-level security changes. The
          #  job cannot verify a backup exists, so it requires somebody
          #  to state that one does — which at least makes skipping it a
          #  decision rather than an oversight.
          if [ "${{ inputs.mode }}" = "apply" ] && [ "${{ inputs.backup_confirmed }}" != "true" ]; then
            echo "::error::Tick backup_confirmed. Take a backup first: Supabase dashboard ->"
            echo "::error::Database -> Backups. Nothing was applied."
            exit 1
          fi

      - name: Link the project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      # What the database believes it has. Read this before anything
      # else: it is the table that decides what a push will attempt, and
      # the dry run below is only meaningful beside it.
      #
      # `supabase migration list` prints one row per LOCAL file — about
      # 190 lines — with the answer in a middle column that is mostly
      # blank. So this filters its own output rather than asking the
      # database separately: the CLI is already authenticated by the
      # link above, which means this step needs no connection string and
      # works with only the access token and database password set.
      - name: Migration history, as the database records it
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase migration list --linked > /tmp/ml.txt 2>&1 || true
          # Columns are `Local` | `Remote` | `Time`, backtick-quoted.
          awk -F'|' '$2 ~ /[0-9]/ {gsub(/[` ]/,"",$2); print $2}' /tmp/ml.txt \
            | sort -u > /tmp/remote.txt
          awk -F'|' '$1 ~ /[0-9]/ && $2 !~ /[0-9]/ {gsub(/[` ]/,"",$1); print $1}' /tmp/ml.txt \
            | sort -u > /tmp/localonly.txt
          echo "RECORDED REMOTE: $(wc -l < /tmp/remote.txt) versions"
          echo "LOCAL ONLY (no remote record): $(wc -l < /tmp/localonly.txt) files"
          echo
          echo "--- every version the remote records, oldest first:"
          tr '\n' ' ' < /tmp/remote.txt; echo
          echo
          echo "--- local files with no remote record, oldest first:"
          tr '\n' ' ' < /tmp/localonly.txt; echo

      - name: Install psql client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      # FINDS THE HOST INSTEAD OF ASKING SOMEBODY TO LOOK IT UP.
      #
      # The dashboard has moved the connection string more than once —
      # it is behind the "Connect" button now, not under Settings ->
      # Database — so a secret whose value a person has to go and find
      # is a standing tax on every future run. The access token already
      # set for the link step can ask the Management API for the project,
      # which returns its direct host and its region, and the pooler
      # hostname is derivable from the region.
      #
      # Both forms are tried because which one answers depends on the
      # project's age: direct connections are IPv6-only on projects
      # created after early 2024 unless they carry the IPv4 add-on, and
      # a GitHub runner cannot reach IPv6. The pooler always has IPv4.
      # The user differs between them — `postgres` direct, but
      # `postgres.<ref>` through the pooler — which is a mismatch that
      # otherwise presents as an authentication failure rather than as a
      # wrong hostname.
      #
      # SUPABASE_DB_HOST still wins when it is set, so nothing here
      # overrides a host somebody has deliberately pinned.
      - name: Find the database host
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGCONNECT_TIMEOUT: '10'
        run: |
          set -u
          candidates=""
          if [ -n "${DB_HOST:-}" ]; then
            echo "SUPABASE_DB_HOST is set; trying it first."
            candidates="postgres.$REF@$DB_HOST"
          fi

          meta=$(curl -sS --max-time 20 \
                   -H "Authorization: Bearer $TOKEN" \
                   "https://api.supabase.com/v1/projects/$REF" || echo '')
          direct=$(printf '%s' "$meta" | python3 -c \
            'import sys,json;d=json.load(sys.stdin);print((d.get("database") or {}).get("host") or "")' \
            2>/dev/null || true)
          region=$(printf '%s' "$meta" | python3 -c \
            'import sys,json;print(json.load(sys.stdin).get("region") or "")' \
            2>/dev/null || true)
          if [ -z "$direct" ] && [ -z "$region" ]; then
            echo "::warning::The Management API returned nothing usable for project $REF."
            echo "Either the access token lacks project read scope, or the ref is wrong."
          else
            echo "Management API says: region=${region:-unknown}"
          fi

          [ -n "$direct" ] && candidates="$candidates postgres@$direct"
          for p in aws-0 aws-1; do
            [ -n "$region" ] && candidates="$candidates postgres.$REF@$p-$region.pooler.supabase.com"
          done

          found=''
          for c in $candidates; do
            host=${c#*@}
            printf 'trying %s ... ' "$host"
            if psql "postgresql://$c:5432/postgres" -Atc 'select 1' >/dev/null 2>&1; then
              echo 'reachable'
              found="$c"
              break
            fi
            echo 'no'
          done

          if [ -z "$found" ]; then
            echo "::warning::No database host answered, so the preflights are skipped."
            echo "Tried: $candidates"
            echo "Set SUPABASE_DB_HOST from the dashboard's Connect button ->"
            echo "Session pooler -> the part between '@' and ':5432'."
            exit 0
          fi
          echo "CONN=postgresql://$found:5432/postgres" >> "$GITHUB_ENV"

      # Both preflights are read-only, so a dry run is the right place
      # for them: they report the live state without changing it, and
      # the push plan below is only interpretable beside them.
      #
      # SKIPPED RATHER THAN FAILED when no host answered. These need a
      # connection string, which the CLI steps above do not. An earlier
      # version built one from a secret that had not been set, producing
      # `postgresql://postgres.***@:5432/...` — which psql reads as a
      # local socket and reports as "is the server running locally?", a
      # message that sends you looking somewhere the problem never was.
      - name: Preflight — objects, and data against the new constraints
        if: env.CONN != ''
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          # -At everywhere: aligned output pads every field, so a later
          # `$4 == "applied"` compares against " applied " and silently
          # never matches. That exact mistake produced an empty repair
          # list on the first run against live.
          echo '=== 02 OBJECTS'
          psql "$CONN" -At -F'|' -f scripts/fix/02-pharma-preflight.sql > /tmp/p02.txt
          echo "present: $(grep -c '|t$' /tmp/p02.txt)   absent: $(grep -c '|f$' /tmp/p02.txt)"
          echo '--- absent:'
          grep '|f$' /tmp/p02.txt | sed 's/^/  /' || echo '  none'

          echo
          echo '=== 03 DATA vs THE NEW CONSTRAINTS'
          psql "$CONN" -At -F'|' -f scripts/fix/03-constraint-preflight.sql | sed 's/^/  /'

          echo
          echo '=== 04 MIGRATION EVIDENCE'
          psql "$CONN" -At -F'|' -f scripts/fix/04-migration-evidence.sql > /tmp/ev.txt
          echo '--- verdicts:'
          awk -F'|' 'NF>=4{print $4}' /tmp/ev.txt | sort | uniq -c | sed 's/^/  /'
          echo '--- NOT cleanly applied (stay out of the repair list):'
          awk -F'|' 'NF>=5 && $4!="applied" {printf "  %s  %s/%s  %-30s %s\n",$1,$3,$2,$4,$5}' /tmp/ev.txt | head -60
          echo '--- nothing probeable (need a human decision):'
          awk -F'|' 'NF==3{printf "  %s  %s\n",$1,$3}' /tmp/ev.txt | head -50
          echo '--- shared timestamps (one repair marks both files):'
          grep 'SHARED TIMESTAMP' /tmp/ev.txt | sed 's/^/  /' || echo '  none'
          echo
          echo "--- repair commands, for the $(awk -F'|' 'NF>=5 && $4=="applied"' /tmp/ev.txt | sort -u -t'|' -k1,1 | wc -l) distinct versions that read applied:"
          awk -F'|' 'NF>=5 && $4=="applied" {print $1}' /tmp/ev.txt | sort -u \
            | while read v; do echo "supabase migration repair --status applied $v"; done

      - name: Preflight skipped — no database host answered
        if: env.CONN == ''
        run: |
          echo "::warning::No reachable database host, so the preflights were skipped."
          echo "The step above lists what it tried. To pin one by hand, set"
          echo "SUPABASE_DB_HOST from the dashboard's Connect button ->"
          echo "Session pooler -> the part between '@' and ':5432'."
          echo "The migration history above does not need it; the preflights do."

      # WRITES HISTORY, EXECUTES NO SQL. `migration repair` inserts rows
      # into supabase_migrations.schema_migrations so a later push knows
      # what it does not need to run. It changes no table and no
      # function.
      #
      # ONLY THE VERSIONS THAT READ 'applied' ARE REPAIRED, and the list
      # comes from 04-migration-evidence run moments earlier against
      # this same database rather than from a file somebody prepared. A
      # version is marked only when every object it creates — tables,
      # views, functions, columns, indexes, triggers, types, constraints
      # — is present. Anything PARTIAL, absent, policy-only or
      # unprobeable is left out, because a wrong mark here tells every
      # future push to skip that migration forever.
      #
      # Reversible with `migration repair --status reverted <version>`,
      # but only by somebody who notices, which is why the list is
      # printed before it is used.
      - name: Repair the migration history
        if: inputs.mode == 'repair'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -u
          if [ -z "${CONN:-}" ]; then
            echo "::error::No database connection, so the evidence cannot be read."
            echo "::error::Nothing was repaired."
            exit 1
          fi
          psql "$CONN" -At -F'|' -f scripts/fix/04-migration-evidence.sql > /tmp/ev.txt
          awk -F'|' 'NF>=5 && $4=="applied" {print $1}' /tmp/ev.txt | sort -u > /tmp/apply.txt
          count=$(wc -l < /tmp/apply.txt)
          if [ "$count" -eq 0 ]; then
            echo "::error::The evidence marked nothing as applied. That is either a real"
            echo "::error::finding or a parsing fault — it has been both. Nothing was repaired."
            exit 1
          fi
          echo "Marking $count versions as applied:"
          tr '\n' ' ' < /tmp/apply.txt; echo
          echo
          echo 'Left alone (not cleanly applied):'
          awk -F'|' 'NF>=5 && $4!="applied" {printf "  %s  %s/%s  %s\n",$1,$3,$2,$4}' /tmp/ev.txt
          echo
          #  One call with every version, falling back to one call each:
          #  the CLI has accepted a list for several releases, and a
          #  partial failure in the middle of a loop is harder to reason
          #  about than a single refusal.
          if ! supabase migration repair --status applied $(cat /tmp/apply.txt | tr '\n' ' '); then
            echo '::warning::The batch repair failed; retrying one version at a time.'
            while read -r v; do
              supabase migration repair --status applied "$v" \
                || echo "::warning::repair failed for $v"
            done < /tmp/apply.txt
          fi
          echo
          echo 'History after the repair:'
          supabase migration list --linked 2>&1 | tail -20

      # `continue-on-error` because a refusal here is INFORMATION, not a
      # fault. The CLI exits non-zero when it finds local files dated
      # before the remote high-water mark — which is precisely the
      # condition this project is in, and precisely what the run is for.
      # Failing the job on it would hide the steps above.
      - name: Dry run — what a push WOULD apply
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked --dry-run

      - name: Apply
        if: inputs.mode == 'apply'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked

      # Proves the apply took, rather than trusting that it did. A
      # migration that reported success and left an object uncreated is
      # exactly the failure this repository has already been bitten by:
      # 20260921000000_licence_lifecycle was absent for weeks and
      # surfaced as "starter licences cannot be saved".
      # Uses the CONN the discovery step established, so the host is
      # never guessed at the end of an otherwise successful apply.
      - name: Verify — re-run the preflight against the project
        if: inputs.mode == 'apply'
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          psql "$CONN" -f scripts/fix/02-pharma-preflight.sql
          psql "$CONN" -f scripts/fix/03-constraint-preflight.sql
