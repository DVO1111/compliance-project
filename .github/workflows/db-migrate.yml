name: Database migrate

# MANUAL ONLY, AND DELIBERATELY NOT ON PUSH.
#
# Connecting this repository to the live Supabase project is the right
# destination. Pushing migrations to it automatically on merge is not,
# and will not be until the project's migration history has been
# reconciled with what the database actually contains.
#
# The reason is specific rather than cautious. `supabase db push` works
# out what to apply by comparing the files in supabase/migrations
# against supabase_migrations.schema_migrations in the target project.
# That table exists in the live project. The live schema, measured by
# scripts/fix/02-pharma-preflight.sql on 2026-10-21, is roughly the
# June schema plus hand-patches from scripts/fix/ — it is missing the
# lifecycle engine (20260905000000), electronic signatures
# (20260917000000), and everything built on them. So the table and the
# schema disagree, and until we know HOW they disagree, a push either
# applies nothing (hiding the gap permanently) or aborts partway
# through fifty migrations (leaving the database half-migrated).
#
# scripts/ci/expected-migration-failures.txt pins fourteen migrations
# that do not apply to a from-scratch Postgres at all, several because
# four files carry no timestamp and sort after every dated one. Those
# are a problem for any replay, in any order, by any tool.
#
# WHEN THE RECONCILIATION IS DONE, the change needed here is to add a
# `push:` trigger. Leave the dry run as the default input either way.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run reports only; repair writes history without executing SQL; apply runs the migrations'
        required: true
        default: dry-run
        type: choice
        options: [dry-run, repair, apply]
      confirm:
        description: 'For repair and apply: type the project ref to confirm. Ignored on a dry run.'
        required: false
        type: string
      skip_backup:
        description: 'For apply only: skip the pre-apply dump (NOT recommended)'
        required: false
        default: false
        type: boolean

concurrency:
  # Two pushes to one database at once is how a migration history gets
  # corrupted. One at a time, and never cancel one in flight.
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    name: ${{ inputs.mode }}
    runs-on: ubuntu-latest
    # A GitHub environment can carry a required reviewer, which is the
    # approval gate for an apply. Configure that in repository settings;
    # this job names it so the gate has somewhere to attach.
    environment: production-database

    # Lifted to the job so step-level `if:` can test it. The secrets
    # context is not available in `if`, but the env context is, which is
    # the only way to skip a step when a secret has not been set.
    env:
      DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install the Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      - name: Refuse a write that was not confirmed
        if: inputs.mode != 'dry-run'
        env:
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ "${{ inputs.confirm }}" != "$REF" ]; then
            echo "::error::The confirm input must be the project ref. Nothing was written."
            exit 1
          fi
          #  The backup is no longer something somebody has to have
          #  done elsewhere. Supabase's automatic backups are a paid
          #  feature and this project is on the free plan, so asking for
          #  one was asking for something unavailable. pg_dump is not
          #  gated, so the job takes its own — see the dump step below.

      - name: Link the project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      # What the database believes it has. Read this before anything
      # else: it is the table that decides what a push will attempt, and
      # the dry run below is only meaningful beside it.
      #
      # `supabase migration list` prints one row per LOCAL file — about
      # 190 lines — with the answer in a middle column that is mostly
      # blank. So this filters its own output rather than asking the
      # database separately: the CLI is already authenticated by the
      # link above, which means this step needs no connection string and
      # works with only the access token and database password set.
      - name: Migration history, as the database records it
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase migration list --linked > /tmp/ml.txt 2>&1 || true
          # Columns are `Local` | `Remote` | `Time`, backtick-quoted.
          awk -F'|' '$2 ~ /[0-9]/ {gsub(/[` ]/,"",$2); print $2}' /tmp/ml.txt \
            | sort -u > /tmp/remote.txt
          awk -F'|' '$1 ~ /[0-9]/ && $2 !~ /[0-9]/ {gsub(/[` ]/,"",$1); print $1}' /tmp/ml.txt \
            | sort -u > /tmp/localonly.txt
          echo "RECORDED REMOTE: $(wc -l < /tmp/remote.txt) versions"
          echo "LOCAL ONLY (no remote record): $(wc -l < /tmp/localonly.txt) files"
          echo
          echo "--- every version the remote records, oldest first:"
          tr '\n' ' ' < /tmp/remote.txt; echo
          echo
          echo "--- local files with no remote record, oldest first:"
          tr '\n' ' ' < /tmp/localonly.txt; echo

      # CLIENT 17, NOT THE RUNNER'S DEFAULT. pg_dump refuses outright
      # when the server is newer than itself ("server version mismatch"),
      # and the runner ships the client for its own Ubuntu release while
      # Supabase chooses the server version. Taking the newest client
      # removes a failure that would otherwise land on the backup step —
      # the one step whose failure must not be the thing that stops an
      # apply halfway.
      - name: Install psql client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl ca-certificates gnupg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          #  Not fatal if it fails: `supabase db dump` is the primary
          #  path and matches the server version itself. This is only
          #  the fallback, and psql (which does not care about the
          #  server being newer) is already on the runner.
          sudo apt-get install -y -qq postgresql-client-17 || \
            echo '::warning::postgresql-client-17 did not install.'
          echo "psql on PATH:    $(psql --version)"
          echo "pg_dump on PATH: $(pg_dump --version)"
          if [ -x /usr/lib/postgresql/17/bin/pg_dump ]; then
            echo "pg_dump 17:      $(/usr/lib/postgresql/17/bin/pg_dump --version)"
          else
            echo 'pg_dump 17:      not present'
          fi

      # FINDS THE HOST INSTEAD OF ASKING SOMEBODY TO LOOK IT UP.
      #
      # The dashboard has moved the connection string more than once —
      # it is behind the "Connect" button now, not under Settings ->
      # Database — so a secret whose value a person has to go and find
      # is a standing tax on every future run. The access token already
      # set for the link step can ask the Management API for the project,
      # which returns its direct host and its region, and the pooler
      # hostname is derivable from the region.
      #
      # Both forms are tried because which one answers depends on the
      # project's age: direct connections are IPv6-only on projects
      # created after early 2024 unless they carry the IPv4 add-on, and
      # a GitHub runner cannot reach IPv6. The pooler always has IPv4.
      # The user differs between them — `postgres` direct, but
      # `postgres.<ref>` through the pooler — which is a mismatch that
      # otherwise presents as an authentication failure rather than as a
      # wrong hostname.
      #
      # SUPABASE_DB_HOST still wins when it is set, so nothing here
      # overrides a host somebody has deliberately pinned.
      - name: Find the database host
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGCONNECT_TIMEOUT: '10'
        run: |
          set -u
          candidates=""
          if [ -n "${DB_HOST:-}" ]; then
            echo "SUPABASE_DB_HOST is set; trying it first."
            candidates="postgres.$REF@$DB_HOST"
          fi

          meta=$(curl -sS --max-time 20 \
                   -H "Authorization: Bearer $TOKEN" \
                   "https://api.supabase.com/v1/projects/$REF" || echo '')
          direct=$(printf '%s' "$meta" | python3 -c \
            'import sys,json;d=json.load(sys.stdin);print((d.get("database") or {}).get("host") or "")' \
            2>/dev/null || true)
          region=$(printf '%s' "$meta" | python3 -c \
            'import sys,json;print(json.load(sys.stdin).get("region") or "")' \
            2>/dev/null || true)
          if [ -z "$direct" ] && [ -z "$region" ]; then
            echo "::warning::The Management API returned nothing usable for project $REF."
            echo "Either the access token lacks project read scope, or the ref is wrong."
          else
            echo "Management API says: region=${region:-unknown}"
          fi

          [ -n "$direct" ] && candidates="$candidates postgres@$direct"
          for p in aws-0 aws-1; do
            [ -n "$region" ] && candidates="$candidates postgres.$REF@$p-$region.pooler.supabase.com"
          done

          found=''
          for c in $candidates; do
            host=${c#*@}
            printf 'trying %s ... ' "$host"
            if psql "postgresql://$c:5432/postgres" -Atc 'select 1' >/dev/null 2>&1; then
              echo 'reachable'
              found="$c"
              break
            fi
            echo 'no'
          done

          if [ -z "$found" ]; then
            echo "::warning::No database host answered, so the preflights are skipped."
            echo "Tried: $candidates"
            echo "Set SUPABASE_DB_HOST from the dashboard's Connect button ->"
            echo "Session pooler -> the part between '@' and ':5432'."
            exit 0
          fi
          echo "CONN=postgresql://$found:5432/postgres" >> "$GITHUB_ENV"

      # Both preflights are read-only, so a dry run is the right place
      # for them: they report the live state without changing it, and
      # the push plan below is only interpretable beside them.
      #
      # SKIPPED RATHER THAN FAILED when no host answered. These need a
      # connection string, which the CLI steps above do not. An earlier
      # version built one from a secret that had not been set, producing
      # `postgresql://postgres.***@:5432/...` — which psql reads as a
      # local socket and reports as "is the server running locally?", a
      # message that sends you looking somewhere the problem never was.
      - name: Preflight — objects, and data against the new constraints
        if: env.CONN != ''
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          # -At everywhere: aligned output pads every field, so a later
          # `$4 == "applied"` compares against " applied " and silently
          # never matches. That exact mistake produced an empty repair
          # list on the first run against live.
          echo '=== 02 OBJECTS'
          psql "$CONN" -At -F'|' -f scripts/fix/02-pharma-preflight.sql > /tmp/p02.txt
          echo "present: $(grep -c '|t$' /tmp/p02.txt)   absent: $(grep -c '|f$' /tmp/p02.txt)"
          echo '--- absent:'
          grep '|f$' /tmp/p02.txt | sed 's/^/  /' || echo '  none'

          echo
          echo '=== 03 DATA vs THE NEW CONSTRAINTS'
          psql "$CONN" -At -F'|' -f scripts/fix/03-constraint-preflight.sql | sed 's/^/  /'

          echo
          echo '=== SESSION SHAPE, as the live database sees this connection'
          #  app_is_service_context() decides whether a migration may act
          #  on another user's behalf, and it was FALSE for the apply —
          #  which is how 20260919 stopped with LIFECYCLE_NOT_AUTHENTICATED.
          #  Its superuser test is false on Supabase because the postgres
          #  role is not a superuser there. 20260918500000 adds a
          #  service_role-membership alternative, but that only engages
          #  when no role is set on the session, and whether the pooler
          #  sets one is not knowable from outside. So it is printed.
          psql "$CONN" -At -F'|' -c "
            SELECT 'session_user='||session_user,
                   'current_user='||current_user,
                   'role='||coalesce(current_setting('role',true),'(unset)'),
                   'rolsuper='||coalesce((SELECT rolsuper FROM pg_roles
                                          WHERE rolname=session_user),false)::text,
                   'can_assume_service_role='||
                     coalesce((SELECT pg_has_role(session_user,'service_role','USAGE')
                               WHERE EXISTS (SELECT 1 FROM pg_roles
                                             WHERE rolname='service_role')),false)::text,
                   'app_is_service_context='||
                     coalesce((SELECT public.app_is_service_context()::text),'(absent)');" \
            | tr '|' '\n' | sed 's/^/  /'

          echo
          echo '=== COLUMN TYPES a from-scratch build and live disagree about'
          #  company_members.role is `text` in a from-scratch build and
          #  the company_role enum here, because 20260329000000 creates
          #  that table under CREATE TABLE IF NOT EXISTS and on live the
          #  table already existed. That divergence stopped the apply at
          #  20261003000000, and it is structurally invisible to a
          #  harness that always builds from scratch — the same shape of
          #  problem as app_is_service_context() testing rolsuper. So the
          #  real types are printed rather than assumed.
          psql "$CONN" -At -F'|' -c "
            SELECT table_name||'.'||column_name||' is '||data_type
                     ||' ('||udt_name||')'
              FROM information_schema.columns
             WHERE table_schema = 'public'
               AND column_name IN ('role','status')
               AND table_name IN ('company_members','profiles')
             ORDER BY table_name, column_name;" | sed 's/^/  /'

          echo
          echo '--- app_has_company_role, which guards RLS on the quality tables:'
          #  Its body is `role = ANY (p_roles)` with p_roles declared
          #  text[]. Where role is the enum that comparison raises at
          #  RUNTIME even though the function exists and every policy
          #  referencing it was created without complaint — creating a
          #  policy only needs the signature, not a body that runs. If
          #  that is the state here, those policies fail closed for real
          #  users. Evaluated rather than reasoned about; the DO block
          #  catches the error so the probe always reports.
          psql "$CONN" -q -c "
            DO \$probe\$
            DECLARE r text;
            BEGIN
              BEGIN
                PERFORM public.app_has_company_role(
                  '00000000-0000-0000-0000-000000000000'::uuid,
                  ARRAY['owner','admin']);
                r := 'evaluates without error';
              EXCEPTION WHEN undefined_function THEN
                r := 'ABSENT from this database';
              WHEN others THEN
                r := 'RAISES: '||SQLERRM;
              END;
              RAISE NOTICE '%', r;
            END \$probe\$;" 2>&1 | sed 's/^/  /'

          echo
          echo '=== 04 MIGRATION EVIDENCE'
          psql "$CONN" -At -F'|' -f scripts/fix/04-migration-evidence.sql > /tmp/ev.txt
          echo '--- verdicts:'
          awk -F'|' 'NF>=4{print $4}' /tmp/ev.txt | sort | uniq -c | sed 's/^/  /'
          echo '--- NOT cleanly applied (stay out of the repair list):'
          awk -F'|' 'NF>=5 && $4!="applied" {printf "  %s  %s/%s  %-30s %s\n",$1,$3,$2,$4,$5}' /tmp/ev.txt | head -60
          echo '--- nothing probeable (need a human decision):'
          awk -F'|' 'NF==3{printf "  %s  %s\n",$1,$3}' /tmp/ev.txt | head -50
          echo '--- shared timestamps (one repair marks both files):'
          grep 'SHARED TIMESTAMP' /tmp/ev.txt | sed 's/^/  /' || echo '  none'
          echo
          echo "--- repair commands, for the $(awk -F'|' 'NF>=5 && $4=="applied"' /tmp/ev.txt | sort -u -t'|' -k1,1 | wc -l) distinct versions that read applied:"
          awk -F'|' 'NF>=5 && $4=="applied" {print $1}' /tmp/ev.txt | sort -u \
            | while read v; do echo "supabase migration repair --status applied $v"; done

      - name: Preflight skipped — no database host answered
        if: env.CONN == ''
        run: |
          echo "::warning::No reachable database host, so the preflights were skipped."
          echo "The step above lists what it tried. To pin one by hand, set"
          echo "SUPABASE_DB_HOST from the dashboard's Connect button ->"
          echo "Session pooler -> the part between '@' and ':5432'."
          echo "The migration history above does not need it; the preflights do."

      # TAKES ITS OWN BACKUP, because Supabase's automatic backups are a
      # paid feature and this project is on the free plan — so requiring
      # a backup that cannot be taken was requiring nothing.
      #
      # THE DUMP CONTAINS REAL CUSTOMER DATA. Two live GMP workspaces,
      # in a GitHub Actions artifact. Artifacts on a private repository
      # are restricted to people with repository access and expire with
      # the retention period, which makes this a point-in-time safety
      # net for this one change rather than a backup policy. It is the
      # lesser risk than applying fifty migrations with no way back, but
      # it is a real one and it is recorded here rather than buried.
      #
      # Schema and data separately, so a structural failure — which is
      # what a bad RLS or constraint migration causes — can be diffed
      # and repaired from the schema file alone without anybody opening
      # the data.
      - name: Back up before applying
        if: inputs.mode == 'apply' && inputs.skip_backup != true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -u
          mkdir -p backup
          stamp=$(date -u +%Y%m%dT%H%M%SZ)

          #  `supabase db dump` RATHER THAN pg_dump DIRECTLY. The live
          #  server is PostgreSQL 17.6 and pg_dump refuses a server
          #  newer than itself. Adding the PGDG repo was not enough: the
          #  runner ships postgresql-client-16 and its wrapper wins on
          #  PATH, so the first attempt still called 16.15 and stopped
          #  with "server version mismatch". The CLI matches the server
          #  version itself, which is the whole reason it has this
          #  command.
          #
          #  The versioned binary is kept as a fallback, called by its
          #  absolute path so no wrapper can choose a different one.
          dump() {
            local what="$1" out="$2"; shift 2
            if supabase db dump --linked --file "$out" "$@"; then
              echo "  $what: via supabase db dump"
              return 0
            fi
            echo "::warning::supabase db dump failed for $what; trying pg_dump 17 directly."
            local pgd=/usr/lib/postgresql/17/bin/pg_dump
            if [ ! -x "$pgd" ]; then
              echo "::error::$pgd is not present either, so no $what backup could be taken."
              return 1
            fi
            local extra=""
            [ "$what" = "data" ] && extra="--data-only"
            [ "$what" = "schema" ] && extra="--schema-only"
            "$pgd" "$CONN" $extra --no-owner --no-privileges > "$out" || return 1
            echo "  $what: via $pgd"
          }

          echo 'Dumping schema…'
          dump schema "backup/schema-$stamp.sql" || {
            echo '::error::Nothing was applied.'; exit 1; }
          echo 'Dumping data…'
          dump data "backup/data-$stamp.sql" --data-only || {
            echo '::error::Nothing was applied.'; exit 1; }

          ls -lh backup/ | sed 's/^/  /'
          #  A dump that failed halfway is worse than no dump, because it
          #  looks like one. Both files must be non-trivial, and the
          #  schema file must carry a marker only a finished dump has.
          for f in "backup/schema-$stamp.sql" "backup/data-$stamp.sql"; do
            size=$(stat -c%s "$f")
            if [ "$size" -lt 2000 ]; then
              echo "::error::$f is only $size bytes — the dump did not complete."
              echo '::error::Nothing was applied.'
              exit 1
            fi
          done
          #  CHECKED BY CONTENT, NOT BY A MARKER STRING. The first
          #  version grepped for pg_dump's "PostgreSQL database dump
          #  complete" footer, and `supabase db dump` does not write it —
          #  so a complete 538K schema dump and a complete 1.2M data
          #  dump were both rejected as unfinished. A check that fails
          #  on good output is worse than no check, because it stops the
          #  thing it was meant to protect.
          #
          #  So: does the schema file actually define this schema, and
          #  does the data file actually carry rows? Both are true of a
          #  finished dump and false of a truncated or empty one,
          #  whichever tool produced it.
          tables=$(grep -c '^CREATE TABLE' "backup/schema-$stamp.sql" || true)
          echo "  schema dump defines $tables tables"
          if [ "$tables" -lt 50 ]; then
            echo "::error::Only $tables CREATE TABLE statements — this database has"
            echo "::error::far more than that, so the schema dump is incomplete."
            echo '::error::Nothing was applied.'
            exit 1
          fi
          if ! grep -q 'public.companies' "backup/schema-$stamp.sql"; then
            echo '::error::The schema dump does not mention public.companies.'
            echo '::error::Nothing was applied.'
            exit 1
          fi
          rows=$(grep -cE '^COPY |^INSERT INTO ' "backup/data-$stamp.sql" || true)
          echo "  data dump carries $rows COPY/INSERT blocks"
          if [ "$rows" -lt 1 ]; then
            echo '::error::The data dump carries no rows at all. Nothing was applied.'
            exit 1
          fi
          echo "backup taken: $stamp"

      - name: Keep the backup
        if: inputs.mode == 'apply' && inputs.skip_backup != true
        uses: actions/upload-artifact@v4
        with:
          name: pre-apply-backup
          path: backup/
          retention-days: 90
          if-no-files-found: error

      # WRITES HISTORY, EXECUTES NO SQL. `migration repair` inserts rows
      # into supabase_migrations.schema_migrations so a later push knows
      # what it does not need to run. It changes no table and no
      # function.
      #
      # ONLY THE VERSIONS THAT READ 'applied' ARE REPAIRED, and the list
      # comes from 04-migration-evidence run moments earlier against
      # this same database rather than from a file somebody prepared. A
      # version is marked only when every object it creates — tables,
      # views, functions, columns, indexes, triggers, types, constraints
      # — is present. Anything PARTIAL, absent, policy-only or
      # unprobeable is left out, because a wrong mark here tells every
      # future push to skip that migration forever.
      #
      # Reversible with `migration repair --status reverted <version>`,
      # but only by somebody who notices, which is why the list is
      # printed before it is used.
      - name: Repair the migration history
        if: inputs.mode == 'repair'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          #  PGPASSWORD AS WELL, and they are not interchangeable:
          #  SUPABASE_DB_PASSWORD is what the CLI reads, PGPASSWORD is
          #  what libpq reads. The first run of this step carried only
          #  the former and psql stopped with "no password supplied".
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -u
          if [ -z "${CONN:-}" ]; then
            echo "::error::No database connection, so the evidence cannot be read."
            echo "::error::Nothing was repaired."
            exit 1
          fi
          #  Checked explicitly rather than left to `bash -e`, which
          #  kills the step on psql's own error and reports psql's
          #  message instead of what it meant for the repair.
          if ! psql "$CONN" -At -F'|' -f scripts/fix/04-migration-evidence.sql > /tmp/ev.txt; then
            echo "::error::The evidence probe could not run, so nothing was repaired."
            exit 1
          fi
          awk -F'|' 'NF>=5 && $4=="applied" {print $1}' /tmp/ev.txt | sort -u > /tmp/apply.txt
          count=$(wc -l < /tmp/apply.txt)
          if [ "$count" -eq 0 ]; then
            echo "::error::The evidence marked nothing as applied. That is either a real"
            echo "::error::finding or a parsing fault — it has been both. Nothing was repaired."
            exit 1
          fi
          echo "Marking $count versions as applied:"
          tr '\n' ' ' < /tmp/apply.txt; echo
          echo
          echo 'Left alone (not cleanly applied):'
          awk -F'|' 'NF>=5 && $4!="applied" {printf "  %s  %s/%s  %s\n",$1,$3,$2,$4}' /tmp/ev.txt
          echo
          #  One call with every version, falling back to one call each:
          #  the CLI has accepted a list for several releases, and a
          #  partial failure in the middle of a loop is harder to reason
          #  about than a single refusal.
          if ! supabase migration repair --status applied $(cat /tmp/apply.txt | tr '\n' ' '); then
            echo '::warning::The batch repair failed; retrying one version at a time.'
            while read -r v; do
              supabase migration repair --status applied "$v" \
                || echo "::warning::repair failed for $v"
            done < /tmp/apply.txt
          fi
          echo
          echo 'History after the repair:'
          supabase migration list --linked 2>&1 | tail -20

      # `continue-on-error` because a refusal here is INFORMATION, not a
      # fault. The CLI exits non-zero when it finds local files dated
      # before the remote high-water mark — which is precisely the
      # condition this project is in, and precisely what the run is for.
      # Failing the job on it would hide the steps above.
      - name: Dry run — what a push WOULD apply
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked --dry-run

      # APPLIES THE MIGRATIONS DIRECTLY, NOT WITH `db push`.
      #
      # `db push` refuses while any local file predates the remote
      # high-water mark, and after the repair 37 files legitimately sit
      # there — partially applied, never applied, or creating only
      # policies a later migration replaced. Recording those as applied
      # to satisfy the ordering rule would hide real gaps forever, so
      # they stay unrecorded and push stays blocked.
      #
      # AND `--include-all` IS NOT AN OPTION, for a reason that has
      # nothing to do with ordering. Among the files it would replay is
      # 20260603600000_seed_nasco_demo_data.sql, whose own comment says
      # it "picks its target with SELECT id FROM companies ORDER BY
      # created_at LIMIT 1 — whatever company happens to be oldest,
      # which on a production database is a real customer". On a GMP
      # system that is fabricated records written into a regulated
      # workspace. That route is closed permanently, not pending a
      # backup.
      #
      # So this applies only the files dated at or after the cutoff: the
      # ones the evidence shows are genuinely missing, none of which is
      # a seed and none of which the harness pins as failing. Each runs
      # in ONE TRANSACTION together with its own history row, so a
      # migration either lands and is recorded or does nothing at all —
      # the half-applied-and-unrecorded state is the one that took this
      # project seven months to notice.
      #
      # ON_ERROR_STOP and a hard stop at the first failure: migrations
      # depend on each other, so carrying on past a failure applies
      # files to a schema their author never saw.
      - name: Apply the missing migrations
        if: inputs.mode == 'apply'
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          CUTOFF: '20260905000000'
        run: |
          set -u
          if [ -z "${CONN:-}" ]; then
            echo "::error::No database connection. Nothing was applied."
            exit 1
          fi

          #  What the database already records, so a re-run is a no-op
          #  rather than a second attempt.
          psql "$CONN" -At -c \
            "SELECT version FROM supabase_migrations.schema_migrations" \
            | sort -u > /tmp/recorded.txt
          echo "already recorded: $(wc -l < /tmp/recorded.txt)"

          : > /tmp/todo.txt
          for f in $(ls supabase/migrations/*.sql | xargs -n1 basename \
                      | grep -E '^[0-9]{14}_' | sort); do
            v="${f%%_*}"
            [ "$v" \< "$CUTOFF" ] && continue
            grep -qx "$v" /tmp/recorded.txt && continue
            echo "$f" >> /tmp/todo.txt
          done

          count=$(wc -l < /tmp/todo.txt)
          echo "to apply: $count"
          sed 's/^/  /' /tmp/todo.txt
          if [ "$count" -eq 0 ]; then
            echo 'Nothing to apply — every migration at or after the cutoff is recorded.'
            exit 0
          fi

          applied=0
          while read -r f; do
            v="${f%%_*}"
            name="${f#*_}"; name="${name%.sql}"
            echo "──── $f"
            #  The migration and its history row in one transaction.
            if psql "$CONN" -v ON_ERROR_STOP=1 --single-transaction -q \
                 -f "supabase/migrations/$f" \
                 -c "INSERT INTO supabase_migrations.schema_migrations(version, name)
                     VALUES ('$v', '$name')
                     ON CONFLICT (version) DO NOTHING;"; then
              applied=$((applied + 1))
              echo "     applied and recorded"
            else
              echo "::error::$f FAILED. It was rolled back and is not recorded."
              echo "::error::$applied migration(s) applied before it, each recorded."
              echo "::error::Stopping here — the files after this one depend on it."
              exit 1
            fi
          done < /tmp/todo.txt

          echo
          echo "applied $applied of $count"

      # PROVES THE APPLY TOOK rather than trusting that it did. A
      # migration that reported success and left an object uncreated is
      # exactly what cost this project two workspaces.
      - name: Verify — re-run the preflight against the project
        if: inputs.mode == 'apply'
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          psql "$CONN" -f scripts/fix/02-pharma-preflight.sql
          psql "$CONN" -f scripts/fix/03-constraint-preflight.sql
