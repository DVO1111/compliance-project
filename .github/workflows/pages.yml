#  Publish to GitHub Pages.
#
#  WHY THIS REPLACED NETLIFY. Netlify refused a deploy with "Account
#  credit usage exceeded — new deploys are blocked until credits are
#  added". The build was fine; the host would not accept it. This
#  repository is public, so GitHub Pages costs nothing and has no deploy
#  quota to exhaust, and it runs on the same two secrets.
#
#  It began as a second destination, with the Netlify job left in place
#  in case that account ever came back. It never did, and criateur.com
#  now resolves here, so the Netlify job was deleted: it had failed on
#  every push for weeks, deploying to a host that serves nobody. A check
#  that is always red is worse than no check, because it teaches you to
#  ignore the colour. If Netlify is ever wanted again it belongs in its
#  own workflow, written then, against whatever that account looks like.
#
#  WHAT A PAGES SITE DOES NOT DO, said plainly:
#
#    - No custom headers. netlify.toml sets X-Frame-Options,
#      X-Content-Type-Options, Referrer-Policy and Permissions-Policy;
#      Pages serves none of them. The Content-Security-Policy is a meta
#      tag in index.html, so that one still applies.
#    - No redirect rules. The SPA fallback is done by copying
#      index.html to 404.html: Pages serves 404.html for any unmatched
#      path, with a 404 status, and the app then routes normally. Good
#      enough for people, not for crawlers.
#    - A project site lives under /<repo>/, so the build sets
#      VITE_BASE_PATH and the app strips that prefix when it reads the
#      route. With a custom domain the base is '/' instead.
#
#  SERVING criateur.com FROM HERE
#  ------------------------------
#  Set a repository VARIABLE — Settings → Secrets and variables →
#  Actions → Variables — named PAGES_CUSTOM_DOMAIN, with the bare
#  domain as its value:
#
#      PAGES_CUSTOM_DOMAIN = criateur.com
#
#  With it set, this builds for the domain root and writes a CNAME
#  file into the artifact. With it unset, nothing changes and the site
#  stays at <user>.github.io/<repo>/.
#
#  IT IS A VARIABLE AND NOT A HARD-CODED VALUE so that the switch can
#  be made, and unmade, without a commit. Flipping the base path in
#  code before the DNS records resolve would take down the working
#  github.io URL and leave nothing serving in its place.
#
#  The DNS records and the Settings → Pages → Custom domain field are
#  the other half, and neither can be done from a workflow.

name: GitHub Pages

on:
  push:
    branches: [main]
  #  So it can be published on demand without waiting for a commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

#  One publish at a time. Queued rather than cancelled: a half-finished
#  deploy is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          #  A custom domain serves the site at its root; a project site
          #  is served under /<repo>/. The trailing slash matters to
          #  Vite either way.
          VITE_BASE_PATH: ${{ vars.PAGES_CUSTOM_DOMAIN != '' && '/' || format('/{0}/', github.event.repository.name) }}
        run: npm run build

      #  THE DESIGN SCREENS, WHERE SOMEBODY CAN ACTUALLY LOOK AT THEM.
      #
      #  scripts/preview/ renders each screen from the Figma file with
      #  canned rows in place of Supabase, so it needs no sign-in, no
      #  workspace and no migrations. It has existed for weeks and was
      #  only ever run on a laptop, which meant the screens were built,
      #  reviewable in principle, and visible to nobody.
      #
      #  That gap is the whole reason this step exists. Three of the six
      #  sections built from the design file have no page in the app
      #  yet, and the rest need tables the live database does not have —
      #  so the harness is currently the ONLY way to see them. It is not
      #  a substitute for the real pages; it is how the work is
      #  inspected while those are built.
      #
      #  Published under /preview/, with a relative base so the assets
      #  resolve from that subdirectory rather than from the site root.
      - name: Build the design-screen preview
        run: |
          npx vite build --config scripts/preview/vite.config.ts
          mkdir -p dist/preview
          cp -r scripts/preview/out/. dist/preview/

          #  The index is DERIVED FROM THE SOURCE, not written by hand,
          #  so it cannot list a screen the harness does not serve or
          #  miss one it does.
          keys=$(grep -oE "screen === '[a-z0-9-]+'" scripts/preview/main.tsx \
                 | sed "s/screen === //" | tr -d "'" | sort -u)
          echo "screens: $(echo $keys | tr '\n' ' ')"
          {
            echo '<!doctype html><html lang="en"><head><meta charset="utf-8">'
            echo '<meta name="viewport" content="width=device-width,initial-scale=1">'
            echo '<title>Criateur design screens</title>'
            echo '<style>'
            echo ':root{color-scheme:light dark}'
            echo 'body{margin:0;padding:32px 20px;font:16px/1.5 system-ui,sans-serif;'
            echo 'max-width:720px;margin-inline:auto;background:#fbfbfc;color:#1f2430}'
            echo '@media(prefers-color-scheme:dark){body{background:#15171c;color:#e8eaee}}'
            echo 'h1{font-size:22px;margin:0 0 6px}p{color:#6b7380;margin:0 0 22px}'
            echo 'ul{list-style:none;padding:0;display:grid;gap:8px}'
            echo 'a{display:block;padding:12px 14px;border:1px solid #d9dde4;border-radius:10px;'
            echo 'text-decoration:none;color:inherit;font-weight:600}'
            echo 'a:hover{border-color:#1f2430}small{font-weight:400;color:#6b7380}'
            echo '</style></head><body>'
            echo '<h1>Design screens</h1>'
            echo '<p>Rendered from the Figma file with canned data. No sign-in,'
            echo 'no workspace, no database.</p><ul>'
            for k in $keys; do
              echo "<li><a href=\"./index.html?screen=$k\">$k</a></li>"
            done
            echo '</ul></body></html>'
          } > dist/preview/screens.html

          #  A preview that silently published nothing would be worse
          #  than no preview, so the output is checked rather than
          #  assumed.
          test -f dist/preview/index.html || { echo '::error::preview index missing'; exit 1; }
          n=$(ls dist/preview/assets/*.js 2>/dev/null | wc -l)
          [ "$n" -ge 1 ] || { echo '::error::preview built no javascript'; exit 1; }
          echo "preview published: $(du -sh dist/preview | cut -f1), $n js bundles"

      - name: Custom domain
        #  Pages stores the domain in its own settings, but a deploy that
        #  carries no CNAME has been known to clear it. Writing the file
        #  costs nothing and makes the artifact self-describing: whatever
        #  is serving it knows which name it answers to.
        if: vars.PAGES_CUSTOM_DOMAIN != ''
        run: echo "${{ vars.PAGES_CUSTOM_DOMAIN }}" > dist/CNAME

      - name: Fail if the build has no Supabase configuration
        #  Without the two secrets the bundle still builds and the site
        #  renders a configuration screen on every route. Better to fail
        #  here, where the reason is written down, than to publish a
        #  site that cannot sign anyone in.
        run: |
          if ! grep -rqs "supabase.co" dist/assets/*.js; then
            echo "::error::No Supabase URL in the bundle — VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY must be set as repository secrets."
            exit 1
          fi

      - name: SPA fallback
        #  Pages has no redirect rules, so an unknown path would 404
        #  instead of reaching the app's router. Serving index.html as
        #  the 404 page is the standard way round it.
        run: cp dist/index.html dist/404.html

      #  NOT `enablement: true`. The workflow token cannot create a
      #  Pages site — GitHub answers "Resource not accessible by
      #  integration" — so asking it to only turns a working build into
      #  a failed one. Pages has to be switched on once, by a person, at
      #  Settings → Pages → Build and deployment → Source: GitHub
      #  Actions. After that this workflow needs nothing further.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
